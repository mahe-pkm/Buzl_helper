services:
  postgres:
    image: postgres:16-alpine
    container_name: buzl-helper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buzl_helper
      POSTGRES_USER: buzl
      POSTGRES_PASSWORD: buzl_local_password
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - buzl_helper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzl -d buzl_helper"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./buzl-backend
      dockerfile: Dockerfile.dev
    container_name: buzl-helper-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://buzl:buzl_local_password@postgres:5432/buzl_helper?schema=public
      DIRECT_URL: postgresql://buzl:buzl_local_password@postgres:5432/buzl_helper?schema=public
      JWT_SECRET: local-dev-only-buzl-helper-secret
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:3000,http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"

  dashboard:
    build:
      context: ./buzl-fashion-helper-FULL_DEV
      dockerfile: Dockerfile.dev
    container_name: buzl-helper-dashboard
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    ports:
      - "127.0.0.1:5174:5174"

  extension-web:
    build:
      context: ./Ext/buzl-fashion-helper
      dockerfile: Dockerfile.dev
    container_name: buzl-helper-extension-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  buzl_helper_postgres_data:
