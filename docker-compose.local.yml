services:
  postgres:
    image: postgres:16-alpine
    container_name: buzl-helper-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buzl_helper
      POSTGRES_USER: buzl
      POSTGRES_PASSWORD: buzl_local_password
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - buzl_helper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzl -d buzl_helper"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  buzl_helper_postgres_data:
